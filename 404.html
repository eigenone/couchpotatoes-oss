<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · CouchPotatoes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#FBF5EA; --ink:#2A1F17; --soft:#5E4D3F; --accent:#C2502E; --line:#E2D3BA; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17120E; --ink:#F3EADB; --soft:#BFAE98; --accent:#E2714D; --line:#3A2E24; color-scheme: dark; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:'DM Sans',sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
    .big { font-family:'Fraunces',serif; font-weight:800; font-size:clamp(72px,18vw,140px); line-height:1; letter-spacing:-.03em; }
    .big span { color:var(--accent); }
    h1 { font-family:'Fraunces',serif; font-size:clamp(24px,5vw,34px); margin:16px 0 8px; }
    p { color:var(--soft); margin:0 0 28px; }
    a { display:inline-block; background:var(--accent); color:#fff; padding:12px 22px; border-radius:999px; font-weight:700; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="big" aria-hidden="true">4<span>⚀</span>4</div>
    <h1>You rolled a page that doesn't exist.</h1>
    <p>No worries, it happens to the best of us. Head back to the table.</p>
    <a href="/">Back to CouchPotatoes</a>
  </main>
</body>
</html>
